<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancada de Craft</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --card: #2b2b2b;
    --tile: #3a3a3a;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4ac3d3;
    --highlight: #d3b04a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  header {
    background: var(--panel);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  nav { margin-bottom: 12px; font-size: 13px; }
  nav a { color: var(--accent); }
  .controles { display: flex; gap: 10px; flex-wrap: wrap; }
  #busca {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    font-size: 16px;
    background: #171717;
    color: var(--text);
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    outline: none;
  }
  #busca:focus { border-color: var(--accent); }
  #filtro-lugar, #filtro-categoria {
    padding: 10px 14px;
    font-size: 15px;
    background: #171717;
    color: var(--text);
    border: 1px solid #3a3a3a;
    border-radius: 6px;
  }
  #contagem { padding: 8px 20px 0; color: var(--muted); font-size: 13px; }
  .aviso {
    margin: 12px 20px 0;
    padding: 10px 14px;
    background: #2b2620;
    border: 1px solid #5a4a2a;
    border-radius: 6px;
    color: var(--highlight);
    font-size: 13px;
    line-height: 1.5;
  }
  main {
    padding: 16px 20px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .thumb {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: #101010;
    cursor: zoom-in;
  }
  .card img { width: 100%; max-height: 200px; object-fit: contain; display: block; }
  .card .info { padding: 12px 14px 14px; }
  .card h2 { margin: 0; font-size: 18px; }
  .card h2.sem-nome { color: var(--muted); font-style: italic; font-size: 16px; }
  .card .local { color: var(--accent); font-size: 13px; margin: 2px 0 8px; }
  .card .categoria {
    display: inline-block;
    background: #383838;
    border: 1px solid #4a4a4a;
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .card li {
    background: var(--tile);
    border-radius: 4px;
    padding: 4px 10px 4px 4px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card li.match { outline: 2px solid var(--highlight); }
  .card li img { width: 34px; height: 34px; object-fit: contain; border-radius: 3px; background: #202020; flex: none; }
  .card li .nome { flex: 1; }
  .card li .nome.sem-nome { color: var(--muted); font-style: italic; font-size: 13px; }
  .card li .qtd { color: var(--accent); white-space: nowrap; font-weight: 600; }
  .incerto { color: var(--highlight); cursor: help; }
  #vazio { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, .85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    padding: 24px;
    cursor: zoom-out;
  }
  #modal.aberto { display: flex; }
  #modal img { max-width: 95vw; max-height: 85vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.8); }
  #modal .legenda { color: var(--text); font-size: 15px; }
  #modal .fechar {
    position: fixed;
    top: 12px;
    right: 18px;
    font-size: 32px;
    line-height: 1;
    color: var(--text);
    background: none;
    border: 0;
    cursor: pointer;
  }
  #modal .fechar:hover { color: var(--highlight); }
</style>
</head>
<body>
<header>
  <nav><a href="index.html">&larr; Trocas com NPCs</a></nav>
  <h1>Bancada de Craft</h1>
  <div class="controles">
    <input id="busca" type="search" placeholder="Buscar receita ou ingrediente..." autofocus>
    <select id="filtro-lugar">
      <option value="">Todos os lugares</option>
    </select>
    <select id="filtro-categoria">
      <option value="">Todas as categorias</option>
    </select>
  </div>
</header>
<div class="aviso" id="aviso"></div>
<div id="contagem"></div>
<main id="resultados"></main>
<div id="modal">
  <button class="fechar" title="Fechar (Esc)">&times;</button>
  <img alt="">
  <div class="legenda"></div>
</div>

<script src="craft.js?v=2026-08-07"></script>
<script>
  const $busca = document.getElementById("busca");
  const $lugar = document.getElementById("filtro-lugar");
  const $categoria = document.getElementById("filtro-categoria");
  const $resultados = document.getElementById("resultados");
  const $contagem = document.getElementById("contagem");

  // Mesma ordem de categorias do catálogo de trocas
  const ORDEM_CATEGORIAS = [
    "Armas",
    "Roupas",
    "Proteção / Máscaras",
    "Acessórios",
    "Detectores e Dispositivos",
    "Outros",
  ];

  function norm(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function popular($sel, valores, ordem) {
    const unicos = [...new Set(valores)].sort();
    const ordenados = ordem
      ? [...unicos].sort((a, b) => {
          const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
          return (ia < 0 ? ordem.length : ia) - (ib < 0 ? ordem.length : ib);
        })
      : unicos;
    ordenados.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      $sel.appendChild(opt);
    });
  }
  popular($lugar, CRAFT.map(r => r.lugar));
  popular($categoria, CRAFT.map(r => r.categoria), ORDEM_CATEGORIAS);

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // Quantos nomes ainda faltam — a bancada não mostra texto, então isso é preenchido à mão
  const total = Object.keys(MATERIAIS_CRAFT).length;
  const semNome = Object.values(MATERIAIS_CRAFT).filter(m => !m.nome).length;
  const aConfirmar = Object.values(MATERIAIS_CRAFT).filter(m => m.nome && m.incerto).length;
  const receitasSemNome = CRAFT.filter(r => !r.item).length;
  document.getElementById("aviso").innerHTML =
    `A tela da bancada não mostra nome nenhum — só o modelo do resultado e os ícones dos ingredientes. ` +
    `Dos <strong>${total}</strong> ingredientes, <strong>${total - semNome - aConfirmar}</strong> estão nomeados, ` +
    `<strong>${aConfirmar}</strong> aguardam confirmação (marcados com "?") e <strong>${semNome}</strong> ainda não têm nome. ` +
    `Faltam também <strong>${receitasSemNome} de ${CRAFT.length}</strong> nomes de resultado (em itálico). ` +
    `As quantidades estão todas conferidas.`;

  // Texto usado na busca: nome quando existe, senão a dica visual
  function rotulo(o) {
    return o.nome || o.item || o.dica || "";
  }

  function render() {
    const termo = norm($busca.value.trim());
    const lugarSel = $lugar.value;
    const categoriaSel = $categoria.value;

    const visiveis = CRAFT.filter(r => {
      if (lugarSel && r.lugar !== lugarSel) return false;
      if (categoriaSel && r.categoria !== categoriaSel) return false;
      if (!termo) return true;
      return norm(rotulo(r)).includes(termo) ||
             r.ingredientes.some(i => norm(rotulo(MATERIAIS_CRAFT[i.id])).includes(termo));
    });

    $resultados.innerHTML = visiveis.map(r => {
      const ingredientes = r.ingredientes.map(i => {
        const m = MATERIAIS_CRAFT[i.id];
        const casou = termo && norm(rotulo(m)).includes(termo);
        const nome = m.nome
          ? `<span class="nome">${esc(m.nome)}` +
            (m.incerto ? ` <span class="incerto" title="${esc(m.dica || "")} — confirmar no jogo">?</span>` : "") +
            `</span>`
          : `<span class="nome sem-nome" title="Nome ainda não confirmado no jogo">${esc(m.dica)} ?</span>`;
        return `<li${casou ? ' class="match"' : ""}>` +
               `<img src="${esc(m.icone)}" alt="" loading="lazy">` +
               nome +
               `<span class="qtd">x${i.qtd}</span></li>`;
      }).join("");
      const titulo = r.item
        ? `<h2>${esc(r.item)}</h2>`
        : `<h2 class="sem-nome" title="Nome ainda não confirmado no jogo">${esc(r.dica)} ?</h2>`;
      return `<div class="card">
        <button class="thumb" type="button" title="Ampliar">
          <img src="${esc(r.imagem)}" alt="${esc(rotulo(r))}" loading="lazy">
        </button>
        <div class="info">
          ${titulo}
          <div class="local">🔧 Bancada de Craft — ${esc(r.lugar)}</div>
          <div class="categoria">${esc(r.categoria)}</div>
          <ul>${ingredientes}</ul>
        </div>
      </div>`;
    }).join("") || '<div id="vazio">Nenhuma receita encontrada.</div>';

    $contagem.textContent = `${visiveis.length} de ${CRAFT.length} receita(s)`;
  }

  const $modal = document.getElementById("modal");
  const $modalImg = $modal.querySelector("img");
  const $modalLegenda = $modal.querySelector(".legenda");

  $resultados.addEventListener("click", e => {
    const thumb = e.target.closest(".thumb");
    if (!thumb) return;
    const img = thumb.querySelector("img");
    $modalImg.src = img.src;
    $modalImg.alt = img.alt;
    $modalLegenda.textContent = img.alt;
    $modal.classList.add("aberto");
  });

  function fecharModal() {
    $modal.classList.remove("aberto");
    $modalImg.src = "";
  }
  $modal.addEventListener("click", fecharModal);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $modal.classList.contains("aberto")) fecharModal();
  });

  $busca.addEventListener("input", render);
  $lugar.addEventListener("change", render);
  $categoria.addEventListener("change", render);
  render();
</script>
</body>
</html>
